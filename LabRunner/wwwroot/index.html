<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Labs</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e4e7ec;
    --accent: #4f46e5; --accent-soft: #eef0ff; --console: #12151c; --console-text: #d7dce5; --ok: #0f9d58; --bad: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 59px); }

  /* left: the labs */
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
  .lab { display: flex; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: inherit; font-size: 14px; cursor: pointer; color: var(--text); }
  .lab:hover { border-color: var(--accent); }
  .lab.active { border-color: var(--accent); background: var(--accent-soft); }
  .lab b { color: var(--accent); min-width: 18px; }
  .next { margin-left: auto; align-self: center; padding: 1px 8px; border-radius: 10px; background: #FFF4DB; color: #9A6200; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .note { margin: 0; padding: 10px 14px; border-radius: 10px; background: #FFF4DB; color: #7A4E00; font-size: 14px; }

  /* right: the selected lab */
  section { display: flex; flex-direction: column; min-width: 0; padding: 24px; gap: 16px; overflow-y: auto; }
  section h2 { margin: 0; font-size: 22px; }
  .about { margin: 0; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; max-height: 240px; overflow-y: auto; }
  form { display: flex; gap: 10px; }
  input { flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button.run { padding: 0 26px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.run:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  pre.output { flex: 1; min-height: 300px; margin: 0; padding: 16px; border-radius: 10px; background: var(--console); color: var(--console-text); font-family: Consolas, monospace; font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow: auto; }
  .placeholder { margin: auto; color: var(--muted); }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="logo">R</div>
  <h1 id="title">RAG Labs</h1>
  <span>Pick a lab, press Run, read the output</span>
</header>
<main>
  <aside>
    <h2>Labs</h2>
    <div id="labs">Loading...</div>
  </aside>
  <section id="lab">
    <div class="placeholder">Choose a lab on the left.</div>
  </section>
</main>

<script>
let labs = [];
let running = false;

// Load the folder title and the list of labs from the server
async function load() {
  const info = await (await fetch("/api/info")).json();
  document.getElementById("title").textContent = info.title;
  document.title = info.title;
  labs = info.labs;
  document.getElementById("labs").innerHTML = labs.map((l, i) =>
    `<button class="lab" data-i="${i}"><b>${escapeHtml(l.id)}</b><span>${escapeHtml(l.title)}</span>${l.nextSession ? '<span class="next">next session</span>' : ""}</button>`).join("");
  document.querySelectorAll(".lab").forEach(b => b.addEventListener("click", () => show(+b.dataset.i)));
}

// Show one lab: its description, a question box if it takes one, and the Run button
function show(i) {
  if (running) return;
  const lab = labs[i];
  document.querySelectorAll(".lab").forEach(b => b.classList.toggle("active", +b.dataset.i === i));
  document.getElementById("lab").innerHTML = `
    <h2>Lab ${escapeHtml(lab.id)}: ${escapeHtml(lab.title)}</h2>
    ${lab.nextSession ? '<p class="note">For the next session (RAG eval). You can still run it.</p>' : ""}
    <pre class="about">${escapeHtml(lab.description)}</pre>
    <form id="form">
      ${lab.takesQuestion ? `<input id="question" placeholder="Your own question (optional, empty = the lab's examples)">` : ""}
      <button class="run" id="run">Run</button>
    </form>
    <div class="status" id="status"></div>
    <pre class="output" id="output">Press Run to start the lab.</pre>`;
  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); run(lab); });
}

// Run the lab on the server and show its output while it arrives
async function run(lab) {
  const output = document.getElementById("output");
  const status = document.getElementById("status");
  const question = document.getElementById("question")?.value.trim() || "";
  running = true;
  document.getElementById("run").disabled = true;
  output.textContent = "";
  status.className = "status";
  const started = Date.now();
  const timer = setInterval(() => status.textContent = `Running... ${Math.round((Date.now() - started) / 1000)} s`, 500);
  try {
    const response = await fetch("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: lab.id, question })
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      output.textContent += decoder.decode(value, { stream: true });
      output.scrollTop = output.scrollHeight;
    }
    status.className = "status ok";
    status.textContent = `Finished in ${Math.round((Date.now() - started) / 1000)} s`;
  } catch (error) {
    status.className = "status bad";
    status.textContent = "Something went wrong: " + error;
  }
  clearInterval(timer);
  running = false;
  document.getElementById("run").disabled = false;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

load();
</script>
</body>
</html>
